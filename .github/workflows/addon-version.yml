name: Add-on Version

# Gives every push that changes the add-on a new version, so Home Assistant
# offers it as an update. Supervisor shows an update whenever the version in
# config.yaml differs from the installed one. See docs/VERSIONING.md.
#
# main            -> 1.2.89, 1.3.0, ... (from Conventional Commit types)
# any other branch -> 1.2.89-dev.1, -dev.2, ... (pre-releases for testing)
#
# Order (config.yaml has `image:`, so HA pulls {arch}-addon-sonorium:<version>):
#   1. version     make the release commit and push only its addon-v* tag. The
#                  tag reserves the number (branches share the -dev.N count)
#                  and HA doesn't read tags, so nobody is offered it yet.
#   2. addon-image build every arch from that tag and push :<version>
#      windows     build the Windows installer from the same tag and test it
#                  on a clean runner (windows-app.yml)
#      linux       build the .deb packages (amd64, arm64) from the same tag and
#                  test them under systemd (linux-deb.yml)
#   3. publish     only when every image was pushed and the installer and
#                  packages passed:
#                  move the branch to the release commit, so HA never sees a
#                  version it can't pull
#   4. addon-tags  move :latest (main), :dev (fixes) or :branch-<name>;
#      docker      the standalone image, as before;
#      windows-release  attach Sonorium-Setup-<version>.exe and the .deb
#                  packages to the GitHub release addon-v<version>:
#                  pre-release on fixes, full release on main, none on other
#                  branches
#   cleanup        if 2 or 3 failed, delete the tag again
#
# The release commit is pushed with GITHUB_TOKEN and tagged "[skip ci]",
# so it does not re-trigger this or any other workflow.

on:
  push:
    branches: ['**']
    paths:
      - 'sonorium_addon/**'
      - '!sonorium_addon/README.md'  # docs only: no new version
      # The Windows app is built from the same tag, so its changes need a version too
      - 'desktop/**'
      - 'packaging/windows/**'
      - '!packaging/windows/docs-screens.ps1'  # CI screenshot script, not shipped
      - '!packaging/windows/README.md'
      # The Linux packages too
      - 'packaging/linux/**'
      - '!packaging/linux/README.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. Features and fixes only ever raise the last number; pick minor or major for a bigger release.'
        type: choice
        options: [auto, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: addon-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Make release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      base: ${{ steps.release.outputs.base }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          # Branch head, not the triggering SHA: a queued run must build on
          # top of the previous run's release commit.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-semantic-release
        run: python -m pip install 'python-semantic-release==10.7.0'

      - name: Make the release commit and reserve its tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          sr() { semantic-release -c releaserc.toml "$@"; }
          ver() { grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | tail -n1; }
          base=$(git rev-parse HEAD)

          release() {
            next=$(sr --noop version --print 2>/dev/null | ver || true)
            last=$(sr --noop version --print-last-released 2>/dev/null | ver || true)
            echo "last released: ${last:-none}, next from commits: ${next:-none}"

            # Commits without a fix:/feat: prefix don't bump on their own, but
            # HA still needs a new version to see the change. Force a patch.
            # On other branches, bump the -dev.N number when the last release was
            # already a pre-release, rather than skipping to the next patch version.
            force=()
            # A merge can bring a branch's -dev tags along, so "next" may be a
            # version that is already tagged: treat that like no bump at all
            if [ -n "$next" ] && git rev-parse -q --verify "refs/tags/addon-v$next" >/dev/null; then
              echo "addon-v$next already exists"
              next=""
            fi
            if [ -z "$next" ] || [ "$next" = "$last" ]; then
              if [ "$BRANCH" = "main" ]; then
                force=(--patch)
              elif [[ "$last" == *-dev.* ]]; then
                force=(--prerelease)
              else
                force=(--patch --as-prerelease)
              fi
              echo "No Conventional Commit bump; forcing ${force[*]}"
            fi

            # A bigger release, chosen by hand when running the workflow
            if [ "$BUMP" != "auto" ]; then
              force=("--$BUMP")
              [ "$BRANCH" = "main" ] || force+=(--as-prerelease)
              echo "Manual $BUMP bump: ${force[*]}"
            fi

            # Commit and tag locally; the branch itself is pushed by "publish"
            sr version "${force[@]}" --no-vcs-release --no-push
            version=$(cat sonorium_addon/sonorium/version)
          }

          # Pushing the tag reserves the version number: another branch's run
          # may have taken it a moment ago, then the push is refused and the
          # next number is worked out. The tag also carries the release commit
          # to GitHub for the image builds.
          for attempt in 1 2 3 4 5; do
            release
            tag="refs/tags/addon-v$version"
            if git push origin "$tag"; then
              break
            fi
            echo "addon-v$version could not be pushed (taken by another run?); trying again ($attempt)"
            git tag -d "addon-v$version"
            git reset -q --hard "$base"
            sleep $((attempt * 5))
            git fetch -q --tags origin
            [ "$attempt" -lt 5 ] || { echo "::error::could not reserve a version"; exit 1; }
          done

          commit=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Reserved addon-v$version ($commit); $BRANCH moves to it only after the images" >> "$GITHUB_STEP_SUMMARY"

  addon-image:
    name: Add-on images
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/addon-image.yml
    with:
      branch: ${{ github.ref_name }}
      ref: addon-v${{ needs.version.outputs.version }}
      hold_branch_tag: true

  windows:
    name: Windows installer
    needs: version
    # The called workflow only reads; its own pre-release job (skipped here, it
    # runs only on pushes to windows-app) declares contents: write, and GitHub
    # refuses the call if a nested job asks for more than the caller grants.
    permissions:
      contents: write
    uses: ./.github/workflows/windows-app.yml
    with:
      ref: addon-v${{ needs.version.outputs.version }}

  linux:
    name: Linux packages
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/linux-deb.yml
    with:
      ref: addon-v${{ needs.version.outputs.version }}

  publish:
    name: Push release commit
    # needs: skips this job unless every add-on image was built and pushed
    # and the Windows installer and Linux packages were built and passed their tests
    needs: [version, addon-image, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          # The release commit and its parent: git needs the parent (the
          # branch head) to see that the push is a fast-forward
          fetch-depth: 2

      - name: Move the branch to the release commit
        env:
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ needs.version.outputs.base }}
          COMMIT: ${{ needs.version.outputs.commit }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Someone pushed while the images were building: leave the branch
          # alone. That push queued its own run, which makes a new version.
          head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$head" != "$BASE" ]; then
            echo "::error::$BRANCH moved to $head while the images were building; $VERSION was not published"
            exit 1
          fi

          # Push with retries: GitHub has occasionally rejected pushes with a
          # bare "(failed)". Fast-forward only: the release commit's parent is $BASE.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "push failed, retrying ($i)"; sleep $((i * 5)); done; return 1; }
          retry git push origin "$COMMIT:refs/heads/$BRANCH"
          echo "Add-on version is now $VERSION" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Release the version number
    # The version was reserved but not published: delete its tag, so the
    # next run can use the number (its images are rebuilt by that run)
    needs: [version, addon-image, windows, linux, publish]
    if: failure() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.base }}

      - name: Delete the tag unless the branch has the release
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ needs.version.outputs.commit }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$head" = "$COMMIT" ]; then
            echo "$BRANCH has $VERSION: keeping the tag"
            exit 0
          fi
          git push origin ":refs/tags/addon-v$VERSION"
          echo "$VERSION was not published; tag addon-v$VERSION deleted" >> "$GITHUB_STEP_SUMMARY"

  addon-tags:
    name: Add-on image tags
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the branch's tag at this version
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then
            moving=latest
          elif [ "$BRANCH" = "fixes" ]; then
            moving=dev
          else
            # Other branches get their own tag, so they never replace what :dev points at
            moving="branch-$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          fi
          for arch in amd64 aarch64; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$arch-addon-sonorium"
            docker buildx imagetools create -t "$image:$moving" "$image:$VERSION"
            echo "$image:$moving -> $VERSION" >> "$GITHUB_STEP_SUMMARY"
          done

  docker:
    name: Docker image
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      branch: ${{ github.ref_name }}

  windows-release:
    name: Windows installer and Linux packages release
    # Only fixes (pre-release) and main (full release) publish the installer and packages
    if: github.ref_name == 'fixes' || github.ref_name == 'main'
    needs: [version, windows, linux, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0  # the tags, for the notes' fallback below

      - uses: actions/download-artifact@v4
        with:
          name: sonorium-setup
          path: setup

      - uses: actions/download-artifact@v4
        with:
          name: sonorium-deb
          path: deb

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          INSTALLER: ${{ needs.windows.outputs.installer }}
        run: |
          set -euo pipefail
          tag="addon-v$VERSION"
          asset="Sonorium-Setup-$VERSION.exe"
          # The app's updater only takes an asset with exactly this name
          if [ "$INSTALLER" != "$asset" ] || [ ! -f "setup/$asset" ]; then
            echo "::error::expected setup/$asset, the build made '$INSTALLER'"; ls -l setup; exit 1
          fi
          debs=(deb/sonorium_*_amd64.deb deb/sonorium_*_arm64.deb)
          for d in "${debs[@]}"; do
            [ -f "$d" ] || { echo "::error::missing $d"; ls -l deb; exit 1; }
          done

          # Release notes: this version's section of the add-on changelog
          awk -v h="## v$VERSION " 'index($0, h) == 1 { on = 1; next } on && /^## v/ { exit } on'             sonorium_addon/CHANGELOG.md > notes.md
          # A version whose changes have no fix:/feat: entry (merges, CI) has an empty section:
          # list the commit subjects since the previous version instead
          if ! grep -q '[^[:space:]]' notes.md; then
            prev=$(git tag --list 'addon-v*' --sort=-creatordate | grep -vx "$tag" | head -1 || true)
            range="${prev:+$prev..}$tag"
            git log --no-merges --format='- %s' "$range" --               | grep -v -e '^- chore(release)' -e '\[skip ci\]' | head -40 > notes.md || true
          fi
          grep -q '[^[:space:]]' notes.md || echo "Sonorium $VERSION" > notes.md
          cat notes.md

          if [ "$BRANCH" = "main" ]; then
            kind=(--latest); title="Sonorium $VERSION"
          else
            kind=(--prerelease --latest=false); title="Sonorium $VERSION (preview)"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md "${kind[@]}"
            gh release upload "$tag" "setup/$asset" "${debs[@]}" --clobber
          else
            gh release create "$tag" "setup/$asset" "${debs[@]}" --verify-tag               --title "$title" --notes-file notes.md "${kind[@]}"
          fi
          echo "Release $tag: $asset ${debs[*]#deb/}" >> "$GITHUB_STEP_SUMMARY"
