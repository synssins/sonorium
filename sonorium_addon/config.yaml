name: Sonorium
version: "1.7.3-dev.40"
slug: sonorium
description: "Multi-zone ambient soundscape mixer for Home Assistant"
url: https://github.com/synssins/sonorium

arch:
  - aarch64
  - amd64

# Prebuilt images: Home Assistant pulls {arch}-addon-sonorium:<version above>
# instead of building the Dockerfile (and compiling FFmpeg) on the device.
# The version above is only ever pushed after CI has pushed that image for
# every arch listed (.github/workflows/addon-version.yml, docs/VERSIONING.md),
# so HA never offers a version it can't pull.
image: ghcr.io/synssins/{arch}-addon-sonorium

init: false
homeassistant_api: true
hassio_api: true
# Home Assistant's users are Sonorium's users: their passwords are checked by the Supervisor's auth API
# (their list comes from Home Assistant's WebSocket API, through homeassistant_api)
auth_api: true
audio: false

# Ingress - enables sidebar integration
ingress: true
# HA's sidebar reaches Sonorium on its own port, never mapped outside: requests
# there come from the Supervisor (172.30.32.2) after HA signed the user in
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:music-circle
panel_title: Sonorium
# Every Home Assistant user sees Sonorium in the sidebar; Sonorium gives each the role they have in HA
panel_admin: false

services:
  - mqtt:need

map:
  - media:rw
  # Sonorium's settings live in its own config folder (/config inside the
  # container), which HA removes on uninstall when asked to delete data (#30).
  # homeassistant_config is only used to copy settings from the old location
  # once (a small marker file is left there so it only happens once).
  - addon_config:rw
  - homeassistant_config:rw

ports:
  8080/tcp: 8008
  8808/tcp: 8808
ports_description:
  8080/tcp: "Web UI, API and streams (HTTP, direct access)"
  8808/tcp: "Web UI and API over HTTPS (the Sonorium app; self-signed certificate)"

options:
  log_level: info
  sonorium__stream_url: "auto"
  sonorium__path_audio: "/media/sonorium"
  sonorium__max_channels: 6
  sonorium__mqtt_host: "auto"
  sonorium__mqtt_port: 0
  sonorium__mqtt_username: ""
  sonorium__mqtt_password: ""
  web_ui_only_through_ha: false
  bypass_login: false

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  sonorium__stream_url: str?
  sonorium__path_audio: str
  sonorium__max_channels: int(1,10)
  sonorium__mqtt_host: str?
  sonorium__mqtt_port: int?
  sonorium__mqtt_username: str?
  sonorium__mqtt_password: str?
  web_ui_only_through_ha: bool
  bypass_login: bool

startup: application
stage: stable

# Direct web UI access (bypasses ingress)
webui: http://[HOST]:[PORT:8080]/
